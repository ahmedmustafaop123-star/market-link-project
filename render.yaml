# Render.com Blueprint — free web service + free PostgreSQL.
# Push this project to GitHub, then on Render: New → Blueprint → select the repo.
databases:
  - name: marketlink-db
    plan: free
    databaseName: app_db
    user: marketlink

services:
  - type: web
    name: marketlink-agri-hub
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: marketlink-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
